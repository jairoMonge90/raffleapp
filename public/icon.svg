<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="cloverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Decorative dashed boundary -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-dasharray="12 12" />

  <!-- Raffle Ticket Shape with Notches -->
  <g filter="url(#shadow)">
    <path d="M 120 180 
             C 120 160, 136 144, 156 144 
             L 356 144 
             C 376 144, 392 160, 392 180 
             L 392 230 
             A 26 26 0 0 0 392 282 
             L 392 332 
             C 392 352, 376 368, 356 368 
             L 156 368 
             C 136 368, 120 352, 120 332 
             L 120 282 
             A 26 26 0 0 0 120 230 
             Z" 
          fill="url(#ticketGrad)" />
  </g>

  <!-- Ticket Perforation Line -->
  <line x1="290" y1="154" x2="290" y2="358" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Four-Leaf Clover on Left (Trébol de cuatro hojas) -->
  <g transform="translate(205, 256)">
    <!-- Golden circular glow backing -->
    <circle cx="0" cy="0" r="50" fill="#fef3c7" opacity="0.9" />
    <circle cx="0" cy="0" r="48" fill="#f59e0b" opacity="0.2" />

    <!-- Clover Stem -->
    <path d="M 0 10 Q 8 42 22 46" stroke="#047857" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- 4 Heart-Shaped Clover Leaves -->
    <!-- Top Leaf (0 deg) -->
    <g transform="translate(0, -18)">
      <path d="M 0 12 C -18 -6 -14 -24 0 -12 C 14 -24 18 -6 0 12 Z" fill="url(#cloverGrad)" />
    </g>
    <!-- Right Leaf (90 deg) -->
    <g transform="translate(18, 0) rotate(90)">
      <path d="M 0 12 C -18 -6 -14 -24 0 -12 C 14 -24 18 -6 0 12 Z" fill="url(#cloverGrad)" />
    </g>
    <!-- Bottom Leaf (180 deg) -->
    <g transform="translate(0, 18) rotate(180)">
      <path d="M 0 12 C -18 -6 -14 -24 0 -12 C 14 -24 18 -6 0 12 Z" fill="url(#cloverGrad)" />
    </g>
    <!-- Left Leaf (270 deg) -->
    <g transform="translate(-18, 0) rotate(270)">
      <path d="M 0 12 C -18 -6 -14 -24 0 -12 C 14 -24 18 -6 0 12 Z" fill="url(#cloverGrad)" />
    </g>

    <!-- Center bud -->
    <circle cx="0" cy="0" r="5" fill="#065f46" />
  </g>

  <!-- Number #777 and LUCKY label on Right Stub -->
  <text x="340" y="246" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#4f46e5" text-anchor="middle">#777</text>
  <text x="340" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#059669" text-anchor="middle">LUCKY</text>
</svg>
